name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    # Keep the quality gate and release build on the only supported platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Check generated shortcut docs
        run: |
          bun run docs
          git diff --exit-code README.md README.zh.md

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile standalone binary
        run: bun build --compile --target=bun-windows-x64 src/index.ts --outfile dist/ssh-cli.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ssh-cli-windows-x64
          path: dist/ssh-cli.exe
          if-no-files-found: error
