name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    # Keep the quality gate on the primary target platform: the release build
    # is tested on Windows first, while the build matrix below covers the rest.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Check generated shortcut docs
        run: |
          bun run docs
          git diff --exit-code README.md README.zh.md

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: bun-windows-x64
            outfile: dist/ssh-cli-windows-x64.exe
          - os: ubuntu-latest
            target: bun-linux-x64
            outfile: dist/ssh-cli-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            outfile: dist/ssh-cli-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install platform dependencies
        run: bun install --frozen-lockfile

      - name: Compile standalone binary
        run: bun build --compile --target=${{ matrix.target }} src/index.ts --outfile ${{ matrix.outfile }}

      - uses: actions/upload-artifact@v4
        with:
          name: ssh-cli-${{ matrix.target }}
          path: ${{ matrix.outfile }}
          if-no-files-found: error
