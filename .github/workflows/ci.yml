name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    # Keep CI on the primary target platform: @opentui/core-win32-x64 is a
    # direct dependency and the release build is currently Windows-only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
